name: Tests

on:
  push:
    branches: ['**']   # branches only: tag pushes are tested by release.yml
  pull_request:
  workflow_dispatch:
  workflow_call:       # lets release.yml run the same tests before releasing

jobs:
  test:
    # Linux has GNU grep and awk, macOS has the BSD versions. The plugin should work with both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run tests
        run: zsh -f tests/run.zsh
